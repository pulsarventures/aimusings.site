- question: "Who is Community Hours for?"
  answer: "Workshop alumni who want to keep the momentum, and AI-curious professionals who haven't taken a workshop yet — product, marketing, ops, sales, consultants, founders. If you want to stay sharp between cohorts, this is the room."

- question: "Do I need to have taken an AI Musings workshop first?"
  answer: "No. Alumni get the most continuity, but the calls are open to anyone. Jump in — the community will catch you up."

- question: "What actually happens on a call?"
  answer: "Ninety minutes, three parts: a prepared presentation on what's moving in AI right now, member demos with honest feedback from the room, and open Q&A for whatever you're stuck on. Every other Friday, 3:00–4:30 PM ET, live online."

- question: "How much does it cost?"
  answer: "$49 a month, everything included — every call, every demo, the peer network. Checkout runs through Stripe. Joining as a team of three or more? Write to sree@aimusings.site."

- question: "Can I cancel anytime?"
  answer: "Yes — membership is month-to-month with no long-term commitment. Cancel whenever you like, and if you ever need a hand with it, write to sree@aimusings.site and we'll take care of it."
