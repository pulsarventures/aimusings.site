<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6c4ac6">
{% seo %}
{% include schema.html %}
{%- comment -%} Bump icon_v on every icon change; browsers cache favicons hard. {%- endcomment -%}
{%- assign icon_v = '2' -%}
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}?v={{ icon_v }}" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicon-32.png' | relative_url }}?v={{ icon_v }}">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}?v={{ icon_v }}">
<link rel="preload" as="font" type="font/woff2" href="{{ '/assets/fonts/77af76e5.woff2' | relative_url }}" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="{{ '/assets/fonts/ea672a3b.woff2' | relative_url }}" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
